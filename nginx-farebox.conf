# ==============================================================================
# NGINX VIRTUAL HOST CONFIGURATION
# Aplikasi  : FAREBOX DATA MANAGEMENT (Node.js Express + PostgreSQL)
# Skenario  : Server Nginx Bersama (Shared Multi-Stack Server)
# Lokasi    : /etc/nginx/sites-available/farebox.conf
# ==============================================================================

# 1. Definisi Upstream ke Node.js Process (PM2 Cluster)
upstream farebox_backend {
    # Pastikan port 3000 sesuai dengan PORT di ecosystem.config.js / .env
    server 127.0.0.1:3000;
    keepalive 32;
}

# 2. Virtual Host (Subdomain / Domain Terisolasi - REKOMENDASI UTAMA)
server {
    listen 80;
    # Ganti dengan nama domain / subdomain yang dialokasikan di server
    server_name farebox.kcic.co.id farebox.internal;

    # Log terisolasi agar tidak bercampur dengan stack lain (PHP/Python/Go)
    access_log /var/log/nginx/farebox_access.log combined;
    error_log  /var/log/nginx/farebox_error.log warn;

    # --------------------------------------------------------------------------
    # PENTING: Batas Ukuran Upload Khusus Aplikasi Farebox
    # Standar default Nginx adalah 1MB (menyebabkan 413 Payload Too Large).
    # Diset 100M di server block ini agar tidak melonggarkan batas app lain.
    # --------------------------------------------------------------------------
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # Timeout Khusus Parsing & Ingestion File Excel Berukuran Besar
    # Mencegah 504 Gateway Timeout saat backend memproses 20.000+ baris data.
    # --------------------------------------------------------------------------
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Header Keamanan Standar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --------------------------------------------------------------------------
    # Optimasi Static Assets: Disajikan langsung oleh Nginx (Hemat Event Loop Node)
    # Sesuaikan path root berikut dengan lokasi aplikasi di server production
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/hprs/public;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri @proxy_backend;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy ke Backend Express
    # --------------------------------------------------------------------------
    location / {
        try_files $uri @proxy_backend;
    }

    location @proxy_backend {
        proxy_pass http://farebox_backend;
        proxy_http_version 1.1;

        # Forwarding Headers untuk Express (didukung app.set('trust proxy', 1))
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Buffer Tuning untuk file upload
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ==============================================================================
# OPSIONAL: Alternatif Sub-path Routing (misal: domain-utama.com/farebox/)
# Gunakan blok di bawah HANYA jika TIDAK BISA menggunakan subdomain terpisah.
